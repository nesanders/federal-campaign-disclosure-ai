name: Refresh AI-spending dataset

on:
  schedule:
    # Weekly, Monday 09:00 UTC. FEC bulk files update on their own cadence;
    # weekly is frequent enough to catch new filings without hammering fec.gov.
    - cron: "0 9 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pipeline dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Fetch FEC bulk data
        run: python pipeline/fetch_fec_bulk.py --cycles 2020 2022 2024 2026

      - name: Fetch congress-legislators data
        run: python pipeline/fetch_legislators.py

      - name: Parse disbursements for AI-vendor matches
        run: python pipeline/parse_disbursements.py --cycles 2020 2022 2024 2026

      - name: Parse independent + coordinated party expenditures for AI-vendor matches
        run: python pipeline/parse_outside_spending.py --cycles 2020 2022 2024 2026

      - name: Build dashboard dataset
        run: python pipeline/build_dataset.py --cycles 2020 2022 2024 2026

      - name: Fetch Massachusetts OCPF data
        run: python pipeline/fetch_ocpf.py

      - name: Parse OCPF records for AI-vendor matches
        run: python pipeline/parse_ocpf.py

      - name: Fetch OCPF report filed dates
        run: python pipeline/fetch_ocpf_report_dates.py

      - name: Fetch OCPF filer party affiliation
        run: python pipeline/fetch_ocpf_filer_party.py

      - name: Build Massachusetts dashboard dataset
        run: python pipeline/build_dataset_ma.py

      - name: Fetch Washington PDC data
        run: python pipeline/fetch_wa.py

      - name: Parse Washington records for AI-vendor matches
        run: python pipeline/parse_wa.py

      - name: Build Washington dashboard dataset
        run: python pipeline/build_dataset_wa.py

      - name: Fetch Colorado TRACER data
        run: python pipeline/fetch_co.py

      - name: Parse Colorado records for AI-vendor matches
        run: python pipeline/parse_co.py

      - name: Build Colorado dashboard dataset
        run: python pipeline/build_dataset_co.py

      - name: Fetch California CAL-ACCESS expenditure data
        run: python pipeline/fetch_ca.py

      - name: Fetch California CAL-ACCESS filer identity data
        run: python pipeline/fetch_ca_filers.py

      - name: Parse California records for AI-vendor matches
        run: python pipeline/parse_ca.py

      - name: Build California dashboard dataset
        run: python pipeline/build_dataset_ca.py

      - name: Build combined States dashboard dataset
        run: python pipeline/build_dataset_states.py

      - name: Build population-based national projection
        run: python pipeline/build_projection.py

      - name: Commit updated dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/dashboard.json docs/data/dashboard_ma.json docs/data/dashboard_wa.json docs/data/dashboard_co.json docs/data/dashboard_ca.json docs/data/dashboard_states.json docs/data/dashboard_projection.json data/processed/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Refresh AI-spending dataset"
            git push
          fi
