# AI vendor taxonomy used to classify FEC Schedule B (itemized disbursement)
# records as "AI-related" spending.
#
# Sourcing: seeded from press coverage of AI usage in campaign filings and
# vendors reportedly selling into the 2026 cycle (American Prospect, CNBC,
# Axios, Habtoor Research Centre coverage of "AI's quiet takeover of the
# midterms", and general-purpose frontier AI labs), then substantially
# expanded by empirically mining the FEC disclosures themselves (see the
# "Second pass" note below). This list is a curated, necessarily incomplete
# starting point, not an exhaustive registry -- FEC purpose-of-disbursement
# text is often generic ("software subscription", "consulting"), so real AI
# usage is understated here even after that expansion. Extend this file as
# new vendors surface.
#
# Matching runs against the concatenation of the disbursement's payee NAME,
# PURPOSE, and CATEGORY_DESC/MEMO_TEXT fields, case-insensitive, on the
# `patterns` (plain regex -- NOT automatically word-boundary wrapped; a
# pattern that needs one, e.g. a short name that could appear as a
# substring of an unrelated word ("openai" inside "OPENAIR"), must include
# its own \b). `confidence: high` patterns are unambiguous vendor/
# product names; `confidence: medium` patterns are words that also have
# common non-AI meanings (e.g. "Gemini", "Copilot", "Grok") and are reported
# separately on the dashboard as lower-confidence signal rather than folded
# into headline counts. An optional `exclude` list of regexes on a vendor
# suppresses a match entirely when present in the same text (e.g. "Gemini
# Trust Company", the crypto exchange, unrelated to Google's Gemini models).
#
# `era` classifies each vendor as `generative` (its product is built on
# modern generative AI -- large language models, diffusion/generative image
# or video, voice cloning, etc.) or `legacy` (a company that predates the
# generative-AI wave and either still runs on older, non-generative
# technology -- rule-based chatbots, statistical NLP, traditional analytics
# -- or bolted a generative feature onto a much older non-AI product). This
# distinction matters because several vendors surfaced by the empirical
# mining pass below (Amplify.ai/TruVerse, Prompt.io, CallTime.AI, Numero,
# EyesOver) were founded years before ChatGPT existed and market themselves
# as "AI" the way that word was used circa 2015 -- lumping their spend in
# with a campaign's ChatGPT or Claude subscription overstates how much
# reported spending reflects the frontier generative-AI adoption this
# dashboard is actually about. The dashboard's charts and tables exclude
# `legacy`-era vendors by default (with a toggle to include them); vendor
# detail pages always show a vendor's full history regardless, tagged with
# its era. Era is assigned from each company's founding year and the
# generation of technology its core product launched on, researched
# per-vendor; see notes on individual entries below where the call isn't
# obvious from the company being a 2020s-founded AI-native startup.
#
# A deliberate scope limit: general-purpose cloud hosting (AWS, Microsoft
# Azure, Google Cloud) is NOT treated as "AI spend" just because the
# provider also sells AI products. Campaigns pay Amazon Web Services and
# Google Cloud for ordinary website hosting and data services constantly
# (234 AWS and 45 "Google Cloud" hits in the 2026 oppexp file alone, almost
# all tagged "WEBSITE HOSTING" / "WIRE SERVICES" / "DATA SERVICE"), and
# counting that as "AI" would be indefensible. Only specific, named
# AI products/services on these platforms count (e.g. "AWS Bedrock",
# "Azure OpenAI Service") -- see the aws_ai / azure_ai entries below. In
# practice, scanning all four cycles found zero disbursements naming a
# specific hyperscaler AI product; campaigns either aren't itemizing that
# level of detail or aren't using those services in a way that shows up in
# a purpose/memo field. That absence is itself a finding, not a gap to
# paper over -- it's surfaced on the dashboard rather than hidden.
#
# Second pass (empirical corpus mining): rather than relying only on
# vendors known from press coverage, we scanned all four cycles' oppexp
# files for generic AI-indicative language (bare "AI", "chatbot", "bot",
# "prompt", etc.) in rows that didn't already match a known vendor, then
# looked at which *payee names* kept surfacing. That's how calltime_ai,
# amplify_ai, prompt_io, numero_ai, otter_ai, daisychain, sosha,
# change_agent_ai, campaign_brain, and several smaller tools below were
# found -- amplify_ai and prompt_io alone represent several million
# dollars that the original vendor list, built from press coverage rather
# than the disclosures themselves, was completely missing. This also
# surfaced a real trap worth documenting: several teleprompter-equipment
# vendors ("Capitol Prompting Service", "VIP Prompting Corporation") have
# "prompting" in their name for the unrelated, decades-old sense of the
# word. A bare "\bprompt\b" pattern would have swept those in as false
# positives, which is why prompt_io below is matched only as "prompt.io",
# never bare "prompt". That same pass is also what surfaced how old some of
# these "AI" vendors actually are, which is why the `era` field exists.
#
# Third pass (partisan-balance check): the site's own analysis noted that
# disclosed generative-era AI spend skews heavily toward Democratic-aligned
# campaigns and committees, and flagged a real risk that this reflects this
# taxonomy's own discovery process (built from press coverage and corpus
# mining that happened to surface more progressive-aligned tools) rather
# than actual campaign behavior -- AAPC survey data reported in Axios
# (April 2026) has Republican consultants self-reporting *more* daily AI
# use than Democratic consultants (64% vs. 49%), which would be hard to
# square with a large real adoption gap in the other direction. This pass
# specifically researched reported GOP-aligned AI campaign tools and added
# campaign_nucleus (Brad Parscale's platform) and convos (bipartisan
# AI-texting platform, formerly PubSent) below, both confirmed as real FEC
# payees before being added. It also considered and rejected Push Digital
# Group / "Push AI" (a Republican digital ad agency that added AI tooling
# internally in 2025): "PUSH DIGITAL" appears as a payee going back to
# 2020, well before its AI pivot, and nothing in how campaigns pay them
# says AI -- the same reasoning that excluded Civis Analytics, Grow
# Progress, and Movement Labs previously. Investigated and found no safe
# pattern for OpenAI's Sora or Google's Veo (both named in 2026 reporting
# on AI-generated political video) either: "sora" collides with a common
# given name and "veo" with an unrelated Spanish-language business name
# ("Veo Veo Estudio"), and neither appeared in the data in a qualified,
# unambiguous form.
#
# Fourth pass (Massachusetts empirical mining): the same corpus-mining
# method from the second pass, run against ~325,000 OCPF (Massachusetts)
# expenditure records instead of FEC's -- grouped by distinct payee,
# scanned for a broad set of AI-indicative keywords ("ai", "gpt", "bot",
# "automat", "generative", "algorithm", "assistant", "synthetic",
# "machine learning", "neural", "smart", etc.), plus a separate read of the
# ~300 highest-dollar unmatched payees regardless of keyword, to catch a
# non-lexical find the way "Quiller" or "BattlegroundAI" were originally
# found. That surfaced read_ai, captions_ai, and canva_ai below, all
# confirmed as real payees with real corresponding AI products before being
# added. It also surfaced, and rejected, several tempting non-matches:
# Robocent and HubDialer (both real political phone/text vendors, but
# neither is AI-branded -- Robocent's own docs say messages go through a
# human agent, and HubDialer markets itself as a "predictive dialer," a
# decades-old statistical telephony technique, not AI); Zapier ($4,166.53
# across 22 payments) considered and rejected because, unlike the
# already-included legacy vendors above, Zapier's core product (rule-based
# "if this, then that" automation) isn't AI-branded at all -- only a 2024+
# "Agents"/"AI Actions" add-on is -- and every matching record here just
# says "software subscription," with nothing distinguishing a charge for
# the AI feature from the plain automation product predating it by over a
# decade; and bare keywords "smart"/"assistant"/"automat" themselves, which
# turned out to be dominated by a consultant literally named Chanda Smart
# and ordinary "campaign assistant" staff titles -- confirming those words
# should never become patterns on their own. A parallel search for
# additional Massachusetts Republican-aligned AI tools (mirroring the third
# pass above) found only Aaru, already in this list.
#
# Fifth pass (Federal-vs-state compare tab): every vendor got a
# `description` -- a one-line, present-tense summary of how a campaign
# actually uses the product (e.g. "AI voice-generation tool used to
# produce narration ... audio without a studio recording"), and `tags` --
# 1-2 ids drawn from the existing `use_case_categories` list below (the
# same vocabulary already used to label disbursement purpose text),
# characterizing the product itself rather than any one payment's stated
# purpose. Both power the vendor table on the new Compare tab, which sits
# alongside a description/tags-free per-disbursement purpose match.

general_purpose:
  - id: openai
    name: OpenAI (ChatGPT)
    homepage: https://openai.com
    era: generative
    description: "General-purpose AI chatbot campaigns use to draft emails, speeches, social media copy, and other written content."
    tags: [communications_copy, administrative_productivity]
    # "openai" bare (no word boundary) matched "OPENAIR" -- a real FEC
    # payee (an airline/travel charge, "AIRFARE" purpose) -- confirmed via
    # the vendor detail page's per-disbursement records. \b fixes it: FEC
    # data never spells the company's name attached to another word this
    # way, unlike some medium-confidence bare-word patterns elsewhere in
    # this file that need an `exclude` list instead.
    patterns:
      - {pattern: "\\bopenai\\b", confidence: high}
      - {pattern: "chat ?gpt", confidence: high}
  - id: anthropic
    name: Anthropic (Claude)
    homepage: https://anthropic.com
    era: generative
    description: "General-purpose AI chatbot (Claude) used for drafting communications, research memos, and policy analysis."
    tags: [communications_copy, research_strategy]
    patterns:
      - {pattern: "\\banthropic\\b", confidence: high}
      - {pattern: "\\bclaude ai\\b", confidence: high}
      - {pattern: "claude\\.ai", confidence: high}
      - {pattern: "\\bclaude\\b", confidence: medium}
    # "claude ai" (no trailing boundary) matched "...CLAUDE AIRFARE" -- a
    # travel reimbursement for someone named Claude, not Anthropic --
    # confirmed via a vendor detail page's per-disbursement records.
    # "Claude" alone collides with people actually named Claude -- confirmed
    # in Massachusetts OCPF data against candidates Jean Claude Sanon and
    # Laverne Claude-Bruce, and in Washington PDC data against a payee
    # named Claude Sansaricq (a $10 refund with no purpose text at all --
    # the payee's own first name was the only thing that matched).
    exclude:
      - "jean.{0,3}claude"
      - "claude.?bruce"
      - "claude.?sansaricq"
  - id: google_ai
    name: Google (Gemini / Vertex AI)
    homepage: https://ai.google
    era: generative
    description: "Google's general-purpose AI assistant and cloud AI platform (Gemini/Vertex AI), used for drafting content and data analysis."
    tags: [communications_copy, research_strategy]
    patterns:
      - {pattern: "google gemini", confidence: high}
      - {pattern: "gemini for google workspace", confidence: high}
      - {pattern: "vertex ai", confidence: high}
      - {pattern: "notebooklm", confidence: high}
      - {pattern: "\\bgoogle ai\\b", confidence: high}
      - {pattern: "gemini", confidence: medium}
    # "Gemini" collides with Gemini Trust Company, a crypto exchange that
    # shows up often in FEC data unrelated to Google's Gemini AI models --
    # also with Gemini Imprints, Gemini Properties, Gemini Sign & Design,
    # and other ordinary small businesses (the word is a zodiac sign and a
    # common business name). Real high-confidence Google-AI hits are rare
    # in this dataset: unlike a standalone ChatGPT or Claude subscription,
    # Gemini is often bundled into a Google Workspace subscription the
    # campaign already pays for email/docs, so there's no separate line
    # item to catch. This likely understates Google's real usage more than
    # it does OpenAI's or Anthropic's.
    exclude:
      - "gemini trust"
      - "gemini space station"
      - "gemini earn"
      - "gemini sign"
      - "gemini productions"
      - "gemini imprints"
      - "gemini printing"
      - "toskr"
      - "exchange fee"
      - "merchant fee"
      - "processing fee"
      - "credit card processing"
      - "bitcoin"
      # GetThru (a real texting/organizing vendor, unrelated to Google) is
      # headquartered on "Gemini Dr" in Beaverton, OR -- found in
      # Washington PDC data, where committees often write their vendor's
      # street address inline in the expenditure description text.
      - "getthru"
      - "gemini dr"
  - id: aws_ai
    name: AWS AI services (Bedrock, SageMaker, Q)
    homepage: https://aws.amazon.com/ai/
    era: generative
    description: "Amazon's AI/ML cloud services (Bedrock, SageMaker, Q), used to build or run AI-powered features in a campaign's own tools."
    tags: [administrative_productivity, data_targeting]
    patterns:
      - {pattern: "aws bedrock", confidence: high}
      - {pattern: "amazon bedrock", confidence: high}
      - {pattern: "amazon sagemaker", confidence: high}
      - {pattern: "\\bamazon q\\b", confidence: high}
      - {pattern: "amazon rekognition", confidence: high}
      - {pattern: "amazon comprehend", confidence: high}
      - {pattern: "amazon textract", confidence: high}
  - id: azure_ai
    name: Microsoft Azure AI
    homepage: https://azure.microsoft.com/en-us/solutions/ai
    era: generative
    description: "Microsoft's AI cloud services (e.g. Azure OpenAI Service), used to power AI features inside campaign software."
    tags: [administrative_productivity, data_targeting]
    patterns:
      - {pattern: "azure openai", confidence: high}
      - {pattern: "azure ai\\b", confidence: high}
      - {pattern: "azure cognitive services", confidence: high}
      - {pattern: "azure machine learning", confidence: high}
  - id: microsoft_copilot
    name: Microsoft Copilot
    homepage: https://copilot.microsoft.com
    era: generative
    description: "Microsoft's AI assistant built into Office apps, used for drafting documents, emails, and presentations."
    tags: [administrative_productivity, communications_copy]
    patterns:
      - {pattern: "microsoft copilot", confidence: high}
      - {pattern: "copilot for microsoft ?365", confidence: high}
      - {pattern: "copilot pro", confidence: high}
      - {pattern: "\\bcopilot\\b", confidence: medium}
  - id: xai_grok
    name: xAI (Grok)
    homepage: https://x.ai
    era: generative
    description: "xAI's general-purpose chatbot, used for drafting content and quick research the way other AI chatbots are."
    tags: [communications_copy, research_strategy]
    patterns:
      - {pattern: "\\bxai\\b", confidence: high}
      - {pattern: "x\\.ai", confidence: high}
      - {pattern: "\\bgrok\\b", confidence: medium}
    # "Grok Media LLC" is an unrelated political digital-ad/media-buying
    # vendor (found in both Schedule B and independent-expenditure records),
    # not xAI's Grok -- confirmed false positive, excluded by name.
    exclude:
      - "grok media"
  - id: perplexity
    name: Perplexity AI
    homepage: https://perplexity.ai
    era: generative
    description: "AI-powered search/research assistant used for opposition research and rapid fact-checking."
    tags: [research_strategy]
    patterns:
      - {pattern: "perplexity", confidence: high}
  - id: meta_ai
    name: Meta AI
    homepage: https://ai.meta.com
    era: generative
    description: "Meta's AI assistant, built into Facebook/Instagram tools campaigns use for ad and social content creation."
    tags: [advertising_creative, communications_copy]
    patterns:
      - {pattern: "meta ai", confidence: high}
      - {pattern: "meta llama", confidence: high}
  - id: midjourney
    name: Midjourney
    homepage: https://midjourney.com
    era: generative
    description: "AI image-generation tool used to create graphics and visuals for ads and social media posts."
    tags: [advertising_creative, synthetic_media]
    patterns:
      - {pattern: "midjourney", confidence: high}
  - id: synthesia
    name: Synthesia
    homepage: https://synthesia.io
    era: generative
    description: "AI video-generation platform used to create avatar-narrated videos for ads and voter outreach without filming."
    tags: [synthetic_media, advertising_creative]
    # Founded 2017 (pre-ChatGPT), but the product has been AI video
    # synthesis from day one, not a legacy tool with AI bolted on later.
    patterns:
      - {pattern: "synthesia", confidence: high}
  - id: elevenlabs
    name: ElevenLabs
    homepage: https://elevenlabs.io
    era: generative
    description: "AI voice-generation and cloning tool used to produce narration, robocall, and ad audio without a studio recording."
    tags: [synthetic_media, advertising_creative]
    patterns:
      - {pattern: "eleven ?labs", confidence: high}
  - id: heygen
    name: HeyGen
    homepage: https://heygen.com
    era: generative
    description: "AI avatar-video generator used to produce spokesperson-style videos for ads and social content."
    tags: [synthetic_media, advertising_creative]
    patterns:
      - {pattern: "heygen", confidence: high}
  - id: runwayml
    name: Runway
    homepage: https://runwayml.com
    era: generative
    description: "AI video-generation and editing tool used to produce and edit ad creative and social video."
    tags: [synthetic_media, advertising_creative]
    patterns:
      - {pattern: "runwayml", confidence: high}
      - {pattern: "runway ai", confidence: high}
      - {pattern: "runway ml", confidence: high}
  - id: descript
    name: Descript
    homepage: https://descript.com
    era: legacy
    description: "AI-powered audio/video editing tool used to edit podcasts, ads, and other campaign video/audio content."
    tags: [advertising_creative]
    # Founded 2017 as a transcript-based audio/video editor; added
    # generative features (Overdub voice cloning) starting 2019 but the
    # core product predates the generative-AI wave.
    patterns:
      - {pattern: "\\bdescript\\b", confidence: high}
    # Gannett/LocalIQ's bank merchant descriptor abbreviates to something
    # like "A/descript..." (likely a mangled "AD/DESCRIPTION"), which
    # collides with this pattern -- confirmed in Massachusetts OCPF data.
    exclude:
      - "localiq"
      - "gan ne"
  - id: jasper_ai
    name: Jasper AI
    homepage: https://jasper.ai
    era: generative
    description: "AI copywriting tool used to draft marketing, advertising, and fundraising copy at scale."
    tags: [advertising_creative, communications_copy]
    patterns:
      - {pattern: "jasper\\.ai", confidence: high}
      - {pattern: "jasper ai", confidence: high}
  - id: adobe_firefly
    name: Adobe Firefly
    homepage: https://firefly.adobe.com
    era: generative
    description: "Adobe's generative AI image tool, used to create and edit graphics for ads and campaign materials."
    tags: [advertising_creative]
    patterns:
      - {pattern: "adobe firefly", confidence: high}
  - id: character_ai
    name: Character.AI
    homepage: https://character.ai
    era: generative
    description: "AI chatbot-persona platform; general-purpose conversational AI occasionally used for content drafting."
    tags: [communications_copy]
    patterns:
      - {pattern: "character\\.ai", confidence: high}
  - id: otter_ai
    name: Otter.ai
    homepage: https://otter.ai
    era: legacy
    description: "AI transcription tool used to transcribe meetings, calls, and events into searchable notes."
    tags: [administrative_productivity, research_strategy]
    # Founded 2016 as a speech-to-text transcription tool; added
    # generative "AI Chat" summarization in 2023, well after founding.
    patterns:
      - {pattern: "otter\\.ai", confidence: high}
      - {pattern: "\\botter ai\\b", confidence: high}
  - id: read_ai
    name: Read.ai
    homepage: https://read.ai
    era: generative
    description: "AI meeting assistant used to transcribe, summarize, and surface insights from calls and meetings."
    tags: [administrative_productivity, research_strategy]
    # AI meeting notetaker/transcription/analytics tool -- the same
    # category as Otter.ai above, confirmed as a real payee in Massachusetts
    # OCPF data (fourth pass, see header note).
    patterns:
      - {pattern: "read\\.ai", confidence: high}
      - {pattern: "\\breadai\\b", confidence: high}
  - id: captions_ai
    name: Captions
    homepage: https://captions.ai
    era: generative
    description: "AI video-editing tool (auto-captions, AI avatars) used to produce short-form social video content."
    tags: [advertising_creative, synthetic_media]
    # AI video-editing/dubbing/auto-caption app (VC-backed, $25M Series B
    # led by Kleiner Perkins), built on generative AI from founding --
    # confirmed as a real payee in Massachusetts OCPF data, billed both as
    # "Captions.ai" and under its maker's other DBA, "Mirage (Captions)".
    patterns:
      - {pattern: "captions\\.ai", confidence: high}
      - {pattern: "mirage \\(captions", confidence: high}
  - id: canva_ai
    name: Canva (Magic Studio / AI Photo)
    homepage: https://canva.com
    era: legacy
    description: "Canva's AI design features (Magic Studio, AI Photo) used to create graphics, flyers, and social media visuals."
    tags: [advertising_creative]
    # Canva itself predates the generative-AI wave (founded 2013); its
    # "Magic Studio" suite (Magic Media image/video generation, Magic Edit,
    # generative fill) is a genuine later-added generative feature set,
    # same pattern as Descript/Grammarly/Otter.ai above. Scoped to the
    # "Canva AI" billing descriptor specifically -- confirmed as a real,
    # recurring payee charge in Massachusetts OCPF data -- rather than bare
    # "Canva", which would also match plain (non-AI) design-subscription
    # charges and, via simple substring matching, "canvassing"/"canvasser."
    patterns:
      - {pattern: "canva ai", confidence: high}
  - id: fal_ai
    name: fal.ai
    homepage: https://fal.ai
    era: generative
    description: "AI image/video generation infrastructure, used by developers building AI-powered creative tools."
    tags: [advertising_creative, synthetic_media]
    patterns:
      - {pattern: "fal\\.ai", confidence: high}
  - id: chatfuel
    name: Chatfuel
    homepage: https://chatfuel.com
    era: legacy
    description: "AI chatbot-builder platform used to run automated Facebook Messenger/website chatbots for voter engagement."
    tags: [communications_copy, data_targeting]
    # Founded 2015 as a rule-based Facebook Messenger chatbot builder,
    # predating generative/LLM-based conversational AI entirely.
    patterns:
      - {pattern: "\\bchatfuel\\b", confidence: high}
  - id: sitespeakai
    name: SiteSpeakAI
    homepage: https://sitespeak.ai
    era: generative
    description: "AI chatbot-builder for websites, used to power an automated Q&A assistant on a campaign's own site."
    tags: [communications_copy, administrative_productivity]
    patterns:
      - {pattern: "sitespeak ?ai", confidence: high}
  - id: smartlead_ai
    name: Smartlead.ai
    homepage: https://smartlead.ai
    era: generative
    description: "AI-assisted cold-email outreach platform used for fundraising and list-building email campaigns."
    tags: [fundraising, communications_copy]
    patterns:
      - {pattern: "smartlead\\.ai", confidence: high}
      - {pattern: "\\bsmartlead ai\\b", confidence: high}
  - id: instantly_ai
    name: Instantly.ai
    homepage: https://instantly.ai
    era: generative
    description: "AI-assisted email outreach/deliverability platform used for fundraising and bulk email campaigns."
    tags: [fundraising, communications_copy]
    patterns:
      - {pattern: "instantly\\.ai", confidence: high}
  - id: air_ai
    name: Air AI
    homepage: https://air.ai
    era: generative
    description: "AI voice-agent platform used to run automated phone calls for voter outreach or fundraising."
    tags: [data_targeting, fundraising]
    patterns:
      - {pattern: "\\bair ai\\b", confidence: high}
      - {pattern: "\\bair\\.ai\\b", confidence: high}
  - id: grammarly
    name: Grammarly
    homepage: https://grammarly.com
    era: legacy
    description: "AI writing-assistant used to proofread and edit campaign emails, press releases, and other copy."
    tags: [communications_copy, administrative_productivity]
    # Founded 2009 on rule-based/statistical grammar checking; added
    # generative rewriting ("GrammarlyGO") only in 2023.
    patterns:
      - {pattern: "\\bgrammarly\\b", confidence: high}
  - id: kling_ai
    name: Kling AI
    homepage: https://klingai.com
    era: generative
    description: "AI video-generation tool used to produce short ad or social video clips from text/image prompts."
    tags: [synthetic_media, advertising_creative]
    patterns:
      # Bare "Kling" is also a common surname (payroll/staff entries for a
      # "Kling, Shannon" showed up in testing); require the "AI" qualifier.
      - {pattern: "\\bkling ai\\b", confidence: high}
  - id: luma_labs
    name: Luma Labs (Luma AI)
    homepage: https://lumalabs.ai
    era: generative
    description: "AI video/3D-generation tool (Luma AI) used to produce visual content for ads and social media."
    tags: [synthetic_media, advertising_creative]
    patterns:
      - {pattern: "luma labs", confidence: high}

political_specific:
  - id: quiller
    name: Quiller
    homepage: https://quiller.ai
    era: generative
    description: "AI-assisted fundraising-email copywriting platform built specifically for political campaigns."
    tags: [fundraising, communications_copy]
    lean_context: progressive-aligned (per public reporting)
    patterns:
      # Bare "Quiller" is also an ordinary English word (a component in
      # textile/spinning machinery) and shows up as an unrelated payee name;
      # only count it high-confidence when qualified with "AI".
      - {pattern: "quiller[ .]ai", confidence: high}
      - {pattern: "\\bquiller\\b", confidence: medium}
  - id: battleground_ai
    name: BattlegroundAI
    homepage: https://battlegroundai.org
    era: generative
    description: "AI platform built for campaigns to draft fundraising and communications copy at scale."
    tags: [fundraising, communications_copy]
    lean_context: progressive-aligned (per public reporting)
    patterns:
      - {pattern: "battleground ?ai", confidence: high}
  - id: chorus_ai
    name: Chorus AI
    homepage: https://chorus.ai
    era: generative
    description: "AI-assisted messaging/copywriting platform built for political campaign communications."
    tags: [communications_copy, fundraising]
    lean_context: progressive-aligned (per public reporting)
    patterns:
      - {pattern: "chorus ai", confidence: high}
      - {pattern: "chorus\\.ai", confidence: high}
  - id: donoratlas
    name: DonorAtlas
    homepage: https://donoratlas.com
    era: generative
    description: "AI-powered donor-prospecting and research platform used to identify and target potential donors."
    tags: [fundraising, data_targeting]
    lean_context: progressive-aligned (per public reporting)
    patterns:
      - {pattern: "donor ?atlas", confidence: high}
  - id: rivalmind
    name: RivalMind
    homepage: https://rivalmind.ai
    era: generative
    description: "AI opposition-research and rapid-response platform built for political campaigns."
    tags: [research_strategy]
    lean_context: progressive-aligned (per public reporting)
    patterns:
      - {pattern: "rivalmind", confidence: high}
      - {pattern: "rival mind ai", confidence: high}
  - id: aaru
    name: Aaru
    homepage: https://aaru.com
    era: generative
    description: "AI voter-simulation and predictive-modeling tool used for campaign strategy and message testing."
    tags: [research_strategy, data_targeting]
    lean_context: reported GOP-aligned use of voter-simulation tools
    patterns:
      - {pattern: "\\baaru\\b", confidence: medium}
  - id: mirofish
    name: MiroFish
    homepage: null
    era: generative
    description: "AI-powered campaign strategy/simulation tool, reported used for message and voter modeling."
    tags: [research_strategy, data_targeting]
    lean_context: reported GOP-aligned use of voter-simulation tools
    patterns:
      - {pattern: "mirofish", confidence: high}
  - id: eyesover
    name: EyesOver
    homepage: https://www.eyesover.us
    era: legacy
    description: "Social-media monitoring/listening tool (legacy \"AI\" branding) used to track press and social sentiment."
    tags: [research_strategy]
    # Founded 2015 as a social-listening/monitoring tool, predating
    # generative-AI-based analysis; brands itself "AI" in the older,
    # analytics-dashboard sense of the word.
    lean_context: reported GOP-aligned social-listening tool; associated with Brad Parscale's Parscale Strategy
    patterns:
      - {pattern: "eyesover", confidence: high}
  - id: calltime_ai
    name: CallTime.AI
    homepage: https://www.calltime.ai
    era: legacy
    description: "Donor call-time scheduling and CRM tool used to organize and prioritize fundraising calls."
    tags: [fundraising, administrative_productivity]
    # Founded 2017, before the generative-AI wave; a donor call-time
    # scheduling/CRM tool rather than an LLM-based product.
    lean_context: progressive-aligned (per public reporting)
    patterns:
      # Payee field spells this every possible way: "CALLTIME.AI",
      # "CALL TIME AI", "CALLTIME AI", "CALL TIME.AI".
      - {pattern: "call ?time[ .]?ai", confidence: high}
  - id: amplify_ai
    name: Amplify.ai (TruVerse)
    homepage: https://truverse.net
    era: legacy
    description: "Rule-based political chatbot/voter-outreach platform (formerly TruVerse) used for automated voter texting and Q&A."
    tags: [communications_copy, data_targeting]
    # Founded 2016 (as TruVerse) as a rule-based political chatbot/voter
    # outreach platform, years before ChatGPT-era generative AI; despite
    # the "AI" name, most of its reported spend predates any generative
    # capability the company may have since added.
    lean_context: reported use by Democratic campaigns and committees (e.g. House Majority PAC)
    patterns:
      - {pattern: "amplify[ .]ai", confidence: high}
      - {pattern: "\\btruverse\\b", confidence: high}
  - id: prompt_io
    name: Prompt.io
    homepage: https://prompt.io
    era: legacy
    description: "Political peer-to-peer texting platform used for voter outreach and fundraising text campaigns."
    tags: [communications_copy, fundraising]
    # Founded 2014 as a political texting/peer-to-peer messaging platform,
    # a decade before "prompt" became generative-AI shorthand; the "AI" in
    # its branding predates the current meaning of the term.
    patterns:
      # Deliberately NOT matching bare "prompt": teleprompter-equipment
      # vendors ("Capitol Prompting Service", "VIP Prompting Corporation")
      # use that word in the unrelated, decades-old sense and would
      # otherwise flood in as false positives.
      - {pattern: "prompt\\.io", confidence: high}
  - id: numero_ai
    name: Numero (donor database / call time)
    homepage: https://www.numero.ai
    era: legacy
    description: "Donor-database and call-time tool used to organize fundraising calls and donor records."
    tags: [fundraising, administrative_productivity]
    # Founded 2018-2019 as a donor-database/call-time tool, before the
    # generative-AI wave reshaped what "AI" campaign tools typically mean.
    patterns:
      # Bare "Numero" is an ordinary Spanish/Italian word for "number";
      # only count it when qualified with "AI" the way the company brands
      # itself ("Numero.AI").
      - {pattern: "numero[ .]ai", confidence: high}
  - id: daisychain
    name: Daisychain
    homepage: https://www.daisychain.app
    era: generative
    description: "AI-assisted political texting platform used for voter outreach and mobilization campaigns."
    tags: [communications_copy, data_targeting]
    lean_context: progressive-aligned (per public reporting)
    patterns:
      # One word in FEC filings ("DAISYCHAIN INC."); kept distinct from the
      # unrelated two-word phrase "daisy chain" (a common wiring/electrical
      # term) by requiring no space.
      - {pattern: "\\bdaisychain\\b", confidence: high}
  - id: sosha
    name: SoSha (Speechifai)
    homepage: https://www.sosha.ai
    era: generative
    description: "AI speech-to-text/content tool (Speechifai) used to turn spoken remarks into written campaign content."
    tags: [communications_copy]
    patterns:
      - {pattern: "\\bsosha\\b", confidence: high}
      - {pattern: "speechifai", confidence: high}
  - id: change_agent_ai
    name: Change Agent AI
    homepage: https://thechange.ai
    era: generative
    description: "AI-assisted organizing/communications platform built for nonprofits, unions, and progressive campaigns."
    tags: [communications_copy, data_targeting]
    lean_context: built for nonprofits, unions & progressive campaigns (per public reporting)
    patterns:
      - {pattern: "change agent ai", confidence: high}
  - id: campaign_brain
    name: Campaign Brain
    homepage: https://www.campaign-brain.com
    era: generative
    description: "AI-assisted campaign strategy and communications platform used to draft plans and messaging."
    tags: [research_strategy, communications_copy]
    patterns:
      - {pattern: "campaign brain", confidence: high}
    # Collides with the ordinary idiom "campaign brain trust" -- confirmed
    # in Massachusetts OCPF data (a state senator's own holiday party).
    exclude:
      - "brain trust"
  - id: campaign_nucleus
    name: Campaign Nucleus
    homepage: https://campaignnucleus.com
    era: legacy
    description: "Campaign CRM/command-center platform (data parsing, sentiment, targeting) used to manage voter and donor data."
    tags: [data_targeting, administrative_productivity]
    # Brad Parscale's ("Parscale Strategy") campaign CRM/command-center
    # platform, in market since ~2020-2021 (confirmed as a real FEC payee
    # -- "CAMPAIGN NUCLEUS" / "CAMPAIGN NUCLEUS LLC" / "WWW.CAMPAIGNNUCLEUS.COM"
    # -- across the 2022, 2024, and 2026 cycles) with data-parsing/sentiment/
    # targeting "AI" positioning that predates generative-AI-era marketing;
    # press reporting on its more recent generative features (AI-drafted
    # emails) dates to 2024. Reported GOP-aligned: Trump campaign, RNC, and
    # affiliated committees have reportedly paid Parscale-linked entities
    # over $2.2M.
    lean_context: reported GOP-aligned; developed by Brad Parscale (Trump 2016/2020 digital director)
    patterns:
      - {pattern: "campaign nucleus", confidence: high}
  - id: convos
    name: Convos (PubSent)
    homepage: https://convos.ai
    era: generative
    description: "AI-agent political texting platform (formerly PubSent) used for automated voter outreach conversations."
    tags: [communications_copy, data_targeting]
    # AI-agent political texting platform, rebranded from PubSent in 2025.
    # Both names are real FEC payees in the 2026 cycle ("CONVOS" and
    # "PUBSENT", both based in Caldwell, NJ). "Convos" alone is an ordinary
    # word (informal for "conversations"), so it's kept medium-confidence;
    # "PubSent" is distinctive enough for high confidence.
    patterns:
      - {pattern: "pubsent", confidence: high}
      - {pattern: "\\bconvos\\b", confidence: medium}
    # Collides with unrelated payees whose name happens to contain "Convos"
    # -- confirmed in Massachusetts OCPF data ("Heavy Hearted Convos Inc.").
    exclude:
      - "heavy hearted"
  - id: votersai
    name: VotersAI
    homepage: https://votersai.com
    era: generative
    description: "AI campaign-management platform covering voter data, outreach, and field operations."
    tags: [data_targeting, administrative_productivity]
    # AI campaign-management platform (voter data, outreach, field ops)
    # that publicly launched March 2026 -- too new to have surfaced in this
    # dataset yet (zero matches as of this writing), added proactively
    # since this taxonomy is meant to be extended as new vendors surface.
    patterns:
      - {pattern: "voters ?ai", confidence: high}

# Use-case categories for classifying disbursement PURPOSE / MEMO_TEXT text.
# A single disbursement may match multiple categories; "unspecified" is used
# when purpose text is too generic (e.g. "software subscription") to say
# more than "this money went to an AI vendor."
use_case_categories:
  - id: advertising_creative
    label: Advertising / creative content
    patterns:
      - "\\bad(s|vertis\\w*)?\\b"
      - "\\bcreative\\b"
      - "\\bvideo\\b"
      - "\\bimage\\b"
      - "\\bgraphic"
      - "\\bsocial media content\\b"
  - id: communications_copy
    label: Communications copywriting (email/text/scripts)
    patterns:
      - "\\bemail\\b"
      - "\\btext message"
      - "\\bsms\\b"
      - "\\bscript"
      - "\\bnewsletter\\b"
      - "\\bcopy ?writ"
      - "\\bmessag\\w* (draft|writ)"
  - id: synthetic_media
    label: Synthetic media / deepfake-adjacent
    patterns:
      - "\\bsynthetic media\\b"
      - "\\bdeepfake"
      - "\\bavatar\\b"
      - "\\bvoice clone"
      - "\\bai[- ]generated\\b"
  - id: research_strategy
    label: Research, polling & strategy
    patterns:
      - "\\bresearch\\b"
      - "\\bpolling\\b"
      - "\\banaly(sis|tics)\\b"
      - "\\bbriefing\\b"
      - "\\bopposition research\\b"
      - "\\bdossier\\b"
      - "\\bstrateg"
  - id: fundraising
    label: Fundraising
    patterns:
      - "\\bfundrais"
      - "\\bdonor\\b"
      - "\\bsolicitation\\b"
  - id: data_targeting
    label: Voter data & targeting
    patterns:
      - "\\bvoter file\\b"
      - "\\btargeting\\b"
      - "\\bmicrotargeting\\b"
      - "\\bdata analytics\\b"
      - "\\bgotv\\b"
  - id: administrative_productivity
    label: Administrative / general productivity
    patterns:
      - "\\bsoftware\\b"
      - "\\bsubscription\\b"
      - "\\blicens"
      - "\\bproductivity\\b"
      - "\\badmin"
      - "\\bbudget"
      - "\\bschedul"
      - "\\bplanning\\b"
  - id: unspecified
    label: Unspecified / generic
    patterns: []
