# AI vendor taxonomy used to classify FEC Schedule B (itemized disbursement)
# records as "AI-related" spending.
#
# Sourcing: seeded from the Washington Post's Sept 2026 reporting on OpenAI/
# ChatGPT usage in campaign filings, plus a round of research into other
# vendors reportedly selling into the 2026 cycle (American Prospect, CNBC,
# Axios, Habtoor Research Centre coverage of "AI's quiet takeover of the
# midterms", and general-purpose frontier AI labs). This list is a curated,
# necessarily incomplete starting point, not an exhaustive registry -- FEC
# purpose-of-disbursement text is often generic ("software subscription",
# "consulting"), so real AI usage is understated here just as it was in the
# Post's OpenAI-only analysis. Extend this file as new vendors surface.
#
# Matching runs against the concatenation of the disbursement's payee NAME,
# PURPOSE, and CATEGORY_DESC/MEMO_TEXT fields, case-insensitive, on the
# `patterns` (regex, word-boundary wrapped by the pipeline unless the pattern
# already contains \b). `confidence: high` patterns are unambiguous vendor/
# product names; `confidence: medium` patterns are words that also have
# common non-AI meanings (e.g. "Gemini", "Copilot", "Grok") and are reported
# separately on the dashboard as lower-confidence signal rather than folded
# into headline counts. An optional `exclude` list of regexes on a vendor
# suppresses a match entirely when present in the same text (e.g. "Gemini
# Trust Company", the crypto exchange, unrelated to Google's Gemini models).
#
# A deliberate scope limit: general-purpose cloud hosting (AWS, Microsoft
# Azure, Google Cloud) is NOT treated as "AI spend" just because the
# provider also sells AI products. Campaigns pay Amazon Web Services and
# Google Cloud for ordinary website hosting and data services constantly
# (234 AWS and 45 "Google Cloud" hits in the 2026 oppexp file alone, almost
# all tagged "WEBSITE HOSTING" / "WIRE SERVICES" / "DATA SERVICE"), and
# counting that as "AI" would be indefensible. Only specific, named
# AI products/services on these platforms count (e.g. "AWS Bedrock",
# "Azure OpenAI Service") -- see the aws_ai / azure_ai entries below. In
# practice, scanning all four cycles found zero disbursements naming a
# specific hyperscaler AI product; campaigns either aren't itemizing that
# level of detail or aren't using those services in a way that shows up in
# a purpose/memo field. That absence is itself a finding, not a gap to
# paper over -- it's surfaced on the dashboard rather than hidden.
#
# Second pass (empirical corpus mining): rather than relying only on
# vendors known from press coverage, we scanned all four cycles' oppexp
# files for generic AI-indicative language (bare "AI", "chatbot", "bot",
# "prompt", etc.) in rows that didn't already match a known vendor, then
# looked at which *payee names* kept surfacing. That's how calltime_ai,
# amplify_ai, prompt_io, numero_ai, otter_ai, daisychain, sosha,
# change_agent_ai, campaign_brain, and several smaller tools below were
# found -- amplify_ai and prompt_io alone represent several million
# dollars that the original vendor list, built from press coverage rather
# than the disclosures themselves, was completely missing. This also
# surfaced a real trap worth documenting: several teleprompter-equipment
# vendors ("Capitol Prompting Service", "VIP Prompting Corporation") have
# "prompting" in their name for the unrelated, decades-old sense of the
# word. A bare "\bprompt\b" pattern would have swept those in as false
# positives, which is why prompt_io below is matched only as "prompt.io",
# never bare "prompt".

general_purpose:
  - id: openai
    name: OpenAI (ChatGPT)
    homepage: https://openai.com
    patterns:
      - {pattern: "openai", confidence: high}
      - {pattern: "chat ?gpt", confidence: high}
  - id: anthropic
    name: Anthropic (Claude)
    homepage: https://anthropic.com
    patterns:
      - {pattern: "\\banthropic\\b", confidence: high}
      - {pattern: "claude ai", confidence: high}
      - {pattern: "claude\\.ai", confidence: high}
      - {pattern: "\\bclaude\\b", confidence: medium}
  - id: google_ai
    name: Google (Gemini / Vertex AI)
    homepage: https://ai.google
    patterns:
      - {pattern: "google gemini", confidence: high}
      - {pattern: "gemini for google workspace", confidence: high}
      - {pattern: "vertex ai", confidence: high}
      - {pattern: "notebooklm", confidence: high}
      - {pattern: "\\bgoogle ai\\b", confidence: high}
      - {pattern: "gemini", confidence: medium}
    # "Gemini" collides with Gemini Trust Company, a crypto exchange that
    # shows up often in FEC data unrelated to Google's Gemini AI models --
    # also with Gemini Imprints, Gemini Properties, Gemini Sign & Design,
    # and other ordinary small businesses (the word is a zodiac sign and a
    # common business name). Real high-confidence Google-AI hits are rare
    # in this dataset: unlike a standalone ChatGPT or Claude subscription,
    # Gemini is often bundled into a Google Workspace subscription the
    # campaign already pays for email/docs, so there's no separate line
    # item to catch. This likely understates Google's real usage more than
    # it does OpenAI's or Anthropic's.
    exclude:
      - "gemini trust"
      - "gemini space station"
      - "gemini earn"
      - "exchange fee"
      - "merchant fee"
      - "credit card processing"
      - "bitcoin"
  - id: aws_ai
    name: AWS AI services (Bedrock, SageMaker, Q)
    homepage: https://aws.amazon.com/ai/
    patterns:
      - {pattern: "aws bedrock", confidence: high}
      - {pattern: "amazon bedrock", confidence: high}
      - {pattern: "amazon sagemaker", confidence: high}
      - {pattern: "\\bamazon q\\b", confidence: high}
      - {pattern: "amazon rekognition", confidence: high}
      - {pattern: "amazon comprehend", confidence: high}
      - {pattern: "amazon textract", confidence: high}
  - id: azure_ai
    name: Microsoft Azure AI
    homepage: https://azure.microsoft.com/en-us/solutions/ai
    patterns:
      - {pattern: "azure openai", confidence: high}
      - {pattern: "azure ai\\b", confidence: high}
      - {pattern: "azure cognitive services", confidence: high}
      - {pattern: "azure machine learning", confidence: high}
  - id: microsoft_copilot
    name: Microsoft Copilot
    homepage: https://copilot.microsoft.com
    patterns:
      - {pattern: "microsoft copilot", confidence: high}
      - {pattern: "copilot for microsoft ?365", confidence: high}
      - {pattern: "copilot pro", confidence: high}
      - {pattern: "\\bcopilot\\b", confidence: medium}
  - id: xai_grok
    name: xAI (Grok)
    homepage: https://x.ai
    patterns:
      - {pattern: "\\bxai\\b", confidence: high}
      - {pattern: "x\\.ai", confidence: high}
      - {pattern: "\\bgrok\\b", confidence: medium}
  - id: perplexity
    name: Perplexity AI
    homepage: https://perplexity.ai
    patterns:
      - {pattern: "perplexity", confidence: high}
  - id: meta_ai
    name: Meta AI
    homepage: https://ai.meta.com
    patterns:
      - {pattern: "meta ai", confidence: high}
      - {pattern: "meta llama", confidence: high}
  - id: midjourney
    name: Midjourney
    homepage: https://midjourney.com
    patterns:
      - {pattern: "midjourney", confidence: high}
  - id: synthesia
    name: Synthesia
    homepage: https://synthesia.io
    patterns:
      - {pattern: "synthesia", confidence: high}
  - id: elevenlabs
    name: ElevenLabs
    homepage: https://elevenlabs.io
    patterns:
      - {pattern: "eleven ?labs", confidence: high}
  - id: heygen
    name: HeyGen
    homepage: https://heygen.com
    patterns:
      - {pattern: "heygen", confidence: high}
  - id: runwayml
    name: Runway
    homepage: https://runwayml.com
    patterns:
      - {pattern: "runwayml", confidence: high}
      - {pattern: "runway ai", confidence: high}
      - {pattern: "runway ml", confidence: high}
  - id: descript
    name: Descript
    homepage: https://descript.com
    patterns:
      - {pattern: "\\bdescript\\b", confidence: high}
  - id: jasper_ai
    name: Jasper AI
    homepage: https://jasper.ai
    patterns:
      - {pattern: "jasper\\.ai", confidence: high}
      - {pattern: "jasper ai", confidence: high}
  - id: adobe_firefly
    name: Adobe Firefly
    homepage: https://firefly.adobe.com
    patterns:
      - {pattern: "adobe firefly", confidence: high}
  - id: character_ai
    name: Character.AI
    homepage: https://character.ai
    patterns:
      - {pattern: "character\\.ai", confidence: high}
  - id: otter_ai
    name: Otter.ai
    homepage: https://otter.ai
    patterns:
      - {pattern: "otter\\.ai", confidence: high}
      - {pattern: "\\botter ai\\b", confidence: high}
  - id: fal_ai
    name: fal.ai
    homepage: https://fal.ai
    patterns:
      - {pattern: "fal\\.ai", confidence: high}
  - id: chatfuel
    name: Chatfuel
    homepage: https://chatfuel.com
    patterns:
      - {pattern: "\\bchatfuel\\b", confidence: high}
  - id: sitespeakai
    name: SiteSpeakAI
    homepage: https://sitespeak.ai
    patterns:
      - {pattern: "sitespeak ?ai", confidence: high}
  - id: smartlead_ai
    name: Smartlead.ai
    homepage: https://smartlead.ai
    patterns:
      - {pattern: "smartlead\\.ai", confidence: high}
      - {pattern: "\\bsmartlead ai\\b", confidence: high}
  - id: instantly_ai
    name: Instantly.ai
    homepage: https://instantly.ai
    patterns:
      - {pattern: "instantly\\.ai", confidence: high}
  - id: air_ai
    name: Air AI
    homepage: https://air.ai
    patterns:
      - {pattern: "\\bair ai\\b", confidence: high}
      - {pattern: "\\bair\\.ai\\b", confidence: high}
  - id: grammarly
    name: Grammarly
    homepage: https://grammarly.com
    patterns:
      - {pattern: "\\bgrammarly\\b", confidence: high}
  - id: kling_ai
    name: Kling AI
    homepage: https://klingai.com
    patterns:
      # Bare "Kling" is also a common surname (payroll/staff entries for a
      # "Kling, Shannon" showed up in testing); require the "AI" qualifier.
      - {pattern: "\\bkling ai\\b", confidence: high}
  - id: luma_labs
    name: Luma Labs (Luma AI)
    homepage: https://lumalabs.ai
    patterns:
      - {pattern: "luma labs", confidence: high}

political_specific:
  - id: quiller
    name: Quiller
    homepage: https://quiller.ai
    lean_context: progressive-aligned (per public reporting)
    patterns:
      # Bare "Quiller" is also an ordinary English word (a component in
      # textile/spinning machinery) and shows up as an unrelated payee name;
      # only count it high-confidence when qualified with "AI".
      - {pattern: "quiller[ .]ai", confidence: high}
      - {pattern: "\\bquiller\\b", confidence: medium}
  - id: battleground_ai
    name: BattlegroundAI
    homepage: https://battlegroundai.org
    lean_context: progressive-aligned (per public reporting)
    patterns:
      - {pattern: "battleground ?ai", confidence: high}
  - id: chorus_ai
    name: Chorus AI
    homepage: https://chorus.ai
    lean_context: progressive-aligned (per public reporting)
    patterns:
      - {pattern: "chorus ai", confidence: high}
      - {pattern: "chorus\\.ai", confidence: high}
  - id: donoratlas
    name: DonorAtlas
    homepage: https://donoratlas.com
    lean_context: progressive-aligned (per public reporting)
    patterns:
      - {pattern: "donor ?atlas", confidence: high}
  - id: rivalmind
    name: RivalMind
    homepage: https://rivalmind.ai
    lean_context: progressive-aligned (per public reporting)
    patterns:
      - {pattern: "rivalmind", confidence: high}
      - {pattern: "rival mind ai", confidence: high}
  - id: aaru
    name: Aaru
    homepage: https://aaru.com
    lean_context: reported GOP-aligned use of voter-simulation tools
    patterns:
      - {pattern: "\\baaru\\b", confidence: medium}
  - id: mirofish
    name: MiroFish
    homepage: null
    lean_context: reported GOP-aligned use of voter-simulation tools
    patterns:
      - {pattern: "mirofish", confidence: high}
  - id: eyesover
    name: EyesOver
    homepage: https://www.eyesover.us
    lean_context: reported GOP-aligned social-listening tool; associated with Brad Parscale's Parscale Strategy
    patterns:
      - {pattern: "eyesover", confidence: high}
  - id: calltime_ai
    name: CallTime.AI
    homepage: https://www.calltime.ai
    lean_context: progressive-aligned (per public reporting)
    patterns:
      # Payee field spells this every possible way: "CALLTIME.AI",
      # "CALL TIME AI", "CALLTIME AI", "CALL TIME.AI".
      - {pattern: "call ?time[ .]?ai", confidence: high}
  - id: amplify_ai
    name: Amplify.ai (TruVerse)
    homepage: https://truverse.net
    lean_context: reported use by Democratic campaigns and committees (e.g. House Majority PAC)
    patterns:
      - {pattern: "amplify[ .]ai", confidence: high}
      - {pattern: "\\btruverse\\b", confidence: high}
  - id: prompt_io
    name: Prompt.io
    homepage: https://prompt.io
    patterns:
      # Deliberately NOT matching bare "prompt": teleprompter-equipment
      # vendors ("Capitol Prompting Service", "VIP Prompting Corporation")
      # use that word in the unrelated, decades-old sense and would
      # otherwise flood in as false positives.
      - {pattern: "prompt\\.io", confidence: high}
  - id: numero_ai
    name: Numero (donor database / call time)
    homepage: https://www.numero.ai
    patterns:
      # Bare "Numero" is an ordinary Spanish/Italian word for "number";
      # only count it when qualified with "AI" the way the company brands
      # itself ("Numero.AI").
      - {pattern: "numero[ .]ai", confidence: high}
  - id: daisychain
    name: Daisychain
    homepage: https://www.daisychain.app
    lean_context: progressive-aligned (per public reporting)
    patterns:
      # One word in FEC filings ("DAISYCHAIN INC."); kept distinct from the
      # unrelated two-word phrase "daisy chain" (a common wiring/electrical
      # term) by requiring no space.
      - {pattern: "\\bdaisychain\\b", confidence: high}
  - id: sosha
    name: SoSha (Speechifai)
    homepage: https://www.sosha.ai
    patterns:
      - {pattern: "\\bsosha\\b", confidence: high}
      - {pattern: "speechifai", confidence: high}
  - id: change_agent_ai
    name: Change Agent AI
    homepage: https://thechange.ai
    lean_context: built for nonprofits, unions & progressive campaigns (per public reporting)
    patterns:
      - {pattern: "change agent ai", confidence: high}
  - id: campaign_brain
    name: Campaign Brain
    homepage: https://www.campaign-brain.com
    patterns:
      - {pattern: "campaign brain", confidence: high}

# Use-case categories for classifying disbursement PURPOSE / MEMO_TEXT text.
# A single disbursement may match multiple categories; "unspecified" is used
# when purpose text is too generic (e.g. "software subscription") to say
# more than "this money went to an AI vendor."
use_case_categories:
  - id: advertising_creative
    label: Advertising / creative content
    patterns:
      - "\\bad(s|vertis\\w*)?\\b"
      - "\\bcreative\\b"
      - "\\bvideo\\b"
      - "\\bimage\\b"
      - "\\bgraphic"
      - "\\bsocial media content\\b"
  - id: communications_copy
    label: Communications copywriting (email/text/scripts)
    patterns:
      - "\\bemail\\b"
      - "\\btext message"
      - "\\bsms\\b"
      - "\\bscript"
      - "\\bnewsletter\\b"
      - "\\bcopy ?writ"
      - "\\bmessag\\w* (draft|writ)"
  - id: synthetic_media
    label: Synthetic media / deepfake-adjacent
    patterns:
      - "\\bsynthetic media\\b"
      - "\\bdeepfake"
      - "\\bavatar\\b"
      - "\\bvoice clone"
      - "\\bai[- ]generated\\b"
  - id: research_strategy
    label: Research, polling & strategy
    patterns:
      - "\\bresearch\\b"
      - "\\bpolling\\b"
      - "\\banaly(sis|tics)\\b"
      - "\\bbriefing\\b"
      - "\\bopposition research\\b"
      - "\\bdossier\\b"
      - "\\bstrateg"
  - id: fundraising
    label: Fundraising
    patterns:
      - "\\bfundrais"
      - "\\bdonor\\b"
      - "\\bsolicitation\\b"
  - id: data_targeting
    label: Voter data & targeting
    patterns:
      - "\\bvoter file\\b"
      - "\\btargeting\\b"
      - "\\bmicrotargeting\\b"
      - "\\bdata analytics\\b"
      - "\\bgotv\\b"
  - id: administrative_productivity
    label: Administrative / general productivity
    patterns:
      - "\\bsoftware\\b"
      - "\\bsubscription\\b"
      - "\\blicens"
      - "\\bproductivity\\b"
      - "\\badmin"
      - "\\bbudget"
      - "\\bschedul"
      - "\\bplanning\\b"
  - id: unspecified
    label: Unspecified / generic
    patterns: []
